name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  orchestrator:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: orchestrator } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: orchestrator/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
  training:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: training } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q
  edge:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: edge } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: edge/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: node test.mjs
  model:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: model } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt ruff  # torch already satisfied by the CPU wheel above
      - run: ruff check . && ruff format --check .
      - run: pytest -q
