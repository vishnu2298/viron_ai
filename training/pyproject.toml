[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# tests put the package dir on sys.path before importing it
"tests/*" = ["E402"]

[tool.pytest.ini_options]
# train_lora.py needs torch/GPU and is exercised on the training box, not in CI
addopts = "--cov=export_traces --cov-report=term-missing --cov-fail-under=80"
